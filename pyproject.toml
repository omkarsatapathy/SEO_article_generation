[project]
name = "seo-agent"
version = "0.1.0"
description = "Multi-agent SEO article generation system using LangGraph"
requires-python = ">=3.11"

dependencies = [
    # ── LangGraph Core ─────────────────────────────────────────
    "langgraph>=0.3.0",                        # core graph framework
    "langgraph-checkpoint>=4.0.0",             # base checkpoint interface
    "langgraph-checkpoint-postgres>=3.0.4",    # PostgresSaver for crash recovery

    # ── LangChain (LLM + Tools abstraction) ────────────────────
    "langchain>=0.3.0",                        # core langchain
    "langchain-anthropic>=0.3.0",              # Claude via Anthropic API
    "langchain-openai>=0.3.0",                 # GPT-4o fallback (optional)
    "langchain-community>=0.3.0",              # community tools (SerpAPI wrapper)

    # ── LLM Providers ──────────────────────────────────────────
    "anthropic>=0.40.0",                       # raw Anthropic SDK
    "openai>=1.50.0",                          # raw OpenAI SDK (fallback)

    # ── Database (PostgreSQL) ───────────────────────────────────
    "psycopg[binary,pool]>=3.2.0",             # psycopg3 — required by PostgresSaver
    "psycopg-pool>=3.2.0",                     # connection pooling for production
    "sqlalchemy>=2.0.0",                       # ORM for generation_jobs table
    "alembic>=1.13.0",                         # DB migrations

    # ── API Layer ───────────────────────────────────────────────
    "fastapi>=0.115.0",                        # REST API
    "uvicorn[standard]>=0.30.0",              # ASGI server
    "pydantic>=2.8.0",                         # data validation + state models
    "pydantic-settings>=2.4.0",               # env var config management

    # ── SERP / Search Data ──────────────────────────────────────
    "google-search-results>=2.4.2",            # SerpAPI official client
    "httpx>=0.27.0",                           # async HTTP (API calls, fallbacks)
    "requests>=2.32.0",                        # sync HTTP

    # ── Observability ───────────────────────────────────────────
    "langsmith>=0.1.100",                      # LangSmith tracing (per-node traces)

    # ── Utilities ───────────────────────────────────────────────
    "python-dotenv>=1.0.0",                    # .env file loading
    "tenacity>=9.0.0",                         # retry logic with backoff
    "tiktoken>=0.7.0",                         # token counting for word_count validation
    "python-ulid>=2.0.0",                      # ULID for job IDs (sortable UUIDs)
]

[project.optional-dependencies]
dev = [
    # ── Testing ─────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",                  # async test support
    "pytest-cov>=5.0.0",                       # coverage reports
    "httpx>=0.27.0",                           # async test client for FastAPI

    # ── Code Quality ─────────────────────────────────────────────
    "ruff>=0.6.0",                             # linting + formatting
    "mypy>=1.11.0",                            # type checking
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "LICENSE*", "pyproject.toml"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live external API calls (e.g. SerpAPI)",
]
asyncio_mode = "strict"
testpaths = ["tests"]
